name: Generate stats card

on:
  schedule:
    - cron: "17 3 * * *"   # daily 03:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/stats.yml]
  pull_request:
    paths: [.github/workflows/stats.yml]

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - name: Generate SVG cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          #!/usr/bin/env python3
          """Render terminal-style GitHub stats SVGs (dark+light) into ./out.

          Stdlib only. Data via GitHub GraphQL (GITHUB_TOKEN), or STATS_OFFLINE
          env (JSON) for local testing.
          """
          import json
          import os
          import sys
          import urllib.request
          from datetime import date, timedelta

          USER = "adirangel"
          OUT = "out"

          QUERY = """
          query($login: String!) {
            user(login: $login) {
              followers { totalCount }
              pullRequests { totalCount }
              issues { totalCount }
              contributionsCollection {
                contributionCalendar {
                  totalContributions
                  weeks { contributionDays { date contributionCount } }
                }
              }
              repositories(ownerAffiliations: OWNER, first: 100, isFork: false) {
                totalCount
                nodes { stargazerCount primaryLanguage { name color } }
              }
            }
          }
          """


          def compute_streaks(days):
              """days: sorted list of (date, count). Returns (current, longest)."""
              longest = run = 0
              for _, c in days:
                  run = run + 1 if c > 0 else 0
                  longest = max(longest, run)
              current = 0
              idx = len(days) - 1
              if idx >= 0 and days[idx][1] == 0:
                  idx -= 1  # today has no contributions yet - streak not broken
              while idx >= 0 and days[idx][1] > 0:
                  current += 1
                  idx -= 1
              return current, longest


          def fetch_stats():
              offline = os.environ.get("STATS_OFFLINE")
              if offline:
                  return json.loads(offline)

              token = os.environ["GITHUB_TOKEN"]
              body = json.dumps({"query": QUERY, "variables": {"login": USER}}).encode()
              req = urllib.request.Request(
                  "https://api.github.com/graphql",
                  data=body,
                  headers={"Authorization": f"bearer {token}", "Content-Type": "application/json"},
              )
              with urllib.request.urlopen(req, timeout=30) as resp:
                  data = json.load(resp)
              if "errors" in data:
                  raise SystemExit(f"GraphQL errors: {data['errors']}")

              user = data["data"]["user"]
              cal = user["contributionsCollection"]["contributionCalendar"]
              today = date.today()
              days = sorted(
                  (d["date"], d["contributionCount"])
                  for w in cal["weeks"]
                  for d in w["contributionDays"]
                  if date.fromisoformat(d["date"]) <= today
              )
              current, longest = compute_streaks(days)

              repos = user["repositories"]
              langs = {}
              for node in repos["nodes"]:
                  lang = node.get("primaryLanguage")
                  if lang:
                      e = langs.setdefault(lang["name"], {"count": 0, "color": lang["color"] or "#8b949e"})
                      e["count"] += 1
              top = sorted(langs.items(), key=lambda kv: -kv[1]["count"])[:5]

              return {
                  "followers": user["followers"]["totalCount"],
                  "prs": user["pullRequests"]["totalCount"],
                  "issues": user["issues"]["totalCount"],
                  "contributions": cal["totalContributions"],
                  "repos": repos["totalCount"],
                  "stars": sum(n["stargazerCount"] for n in repos["nodes"]),
                  "current_streak": current,
                  "longest_streak": longest,
                  "langs": [{"name": n, "count": i["count"], "color": i["color"]} for n, i in top],
              }


          THEMES = {
              "dark": {"border": "#3d59a1", "title": "#38bdae", "prompt": "#bf91f3",
                       "label": "#a9b1d6", "value": "#70a5fd", "dim": "#565f89"},
              "light": {"border": "#d0d7de", "title": "#1a7f37", "prompt": "#8250df",
                        "label": "#57606a", "value": "#0969da", "dim": "#6e7781"},
          }

          W, H = 560, 230
          FONT = "'JetBrains Mono','Cascadia Code',Consolas,'Liberation Mono',monospace"


          def render(s, theme):
              c = THEMES[theme]
              fmt = lambda n: f"{n:,}"
              rows = [
                  ("stars", fmt(s["stars"]), "repos", fmt(s["repos"])),
                  ("commits (1y)", fmt(s["contributions"]), "pull requests", fmt(s["prs"])),
                  ("issues", fmt(s["issues"]), "followers", fmt(s["followers"])),
                  ("current streak", f'{s["current_streak"]}d 🔥', "longest streak", f'{s["longest_streak"]}d'),
              ]
              p = [
                  f'<svg xmlns="http://www.w3.org/2000/svg" width="{W}" height="{H}" viewBox="0 0 {W} {H}" role="img" aria-label="GitHub stats for {USER}">',
                  f'<rect x="0.5" y="0.5" width="{W-1}" height="{H-1}" rx="10" fill="none" stroke="{c["border"]}" stroke-opacity="0.6"/>',
                  '<circle cx="22" cy="22" r="5.5" fill="#ff5f56"/>',
                  '<circle cx="40" cy="22" r="5.5" fill="#ffbd2e"/>',
                  '<circle cx="58" cy="22" r="5.5" fill="#27c93f"/>',
                  f'<text x="76" y="27" font-family={json.dumps(FONT)} font-size="13" fill="{c["prompt"]}">{USER}@devops:~$'
                  f' <tspan fill="{c["title"]}">./stats.sh --live</tspan></text>',
                  f'<line x1="16" y1="38" x2="{W-16}" y2="38" stroke="{c["border"]}" stroke-opacity="0.35"/>',
              ]
              y = 64
              for l1, v1, l2, v2 in rows:
                  p.append(
                      f'<text x="28" y="{y}" font-family={json.dumps(FONT)} font-size="13">'
                      f'<tspan fill="{c["title"]}">▸</tspan> <tspan fill="{c["label"]}">{l1}</tspan>'
                      f'<tspan x="200" fill="{c["value"]}" font-weight="bold">{v1}</tspan>'
                      f'<tspan x="300" fill="{c["title"]}">▸</tspan> <tspan fill="{c["label"]}">{l2}</tspan>'
                      f'<tspan x="480" fill="{c["value"]}" font-weight="bold">{v2}</tspan></text>'
                  )
                  y += 26
              langs = s["langs"]
              total = sum(l["count"] for l in langs) or 1
              bx, bw, by = 28, W - 56, 182
              x = bx
              p.append(f'<clipPath id="bar"><rect x="{bx}" y="{by}" width="{bw}" height="8" rx="4"/></clipPath>')
              for lang in langs:
                  seg = bw * lang["count"] / total
                  p.append(f'<rect x="{x:.1f}" y="{by}" width="{seg:.1f}" height="8" fill="{lang["color"]}" clip-path="url(#bar)"/>')
                  x += seg
              lx = bx
              for lang in langs:
                  p.append(
                      f'<circle cx="{lx+4}" cy="{by+25}" r="4" fill="{lang["color"]}"/>'
                      f'<text x="{lx+13}" y="{by+29}" font-family={json.dumps(FONT)} font-size="11" fill="{c["dim"]}">{lang["name"]}</text>'
                  )
                  lx += 13 + 7 * len(lang["name"]) + 22
              p.append("</svg>")
              return "\n".join(p) + "\n"


          def main():
              if os.environ.get("STATS_SELFTEST"):
                  assert compute_streaks([]) == (0, 0)
                  assert compute_streaks([("d1", 1), ("d2", 1), ("d3", 0), ("d4", 1)]) == (1, 2)
                  assert compute_streaks([("d1", 0), ("d2", 1), ("d3", 2), ("d4", 0)]) == (2, 2)
                  assert compute_streaks([("d1", 1), ("d2", 1), ("d3", 1)]) == (3, 3)
                  print("selftest OK", file=sys.stderr)
                  return
              stats = fetch_stats()
              os.makedirs(OUT, exist_ok=True)
              for theme in THEMES:
                  suffix = "-dark" if theme == "dark" else ""
                  path = os.path.join(OUT, f"github-stats{suffix}.svg")
                  with open(path, "w") as f:
                      f.write(render(stats, theme))
                  print(f"wrote {path}", file=sys.stderr)


          if __name__ == "__main__":
              main()
          PY

      - name: Publish to stats branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          git init -q -b stats
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "chore: refresh stats card"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" stats:stats

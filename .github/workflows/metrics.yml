name: Generate metrics card

on:
  schedule:
    - cron: "17 3 * * *"   # daily 03:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/metrics.yml]
  pull_request:
    paths: [.github/workflows/metrics.yml]

permissions:
  contents: write

jobs:
  metrics:
    # Pinned: on ubuntu-26.04 the action's `expr ... == 0` release check errors
    # out, so it pulls the v3.34-beta image instead of the released v3.34.
    runs-on: ubuntu-24.04
    steps:
      - uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: adirangel
          template: classic
          filename: github-metrics.svg
          committer_branch: stats
          committer_message: "chore: refresh metrics card"
          base: header, repositories
          config_timezone: Asia/Jerusalem
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_languages: yes
          plugin_languages_limit: 6
